{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Oven Fresh Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><span>🥖</span> OVEN FRESH</div>
            <ul class="sidebar-menu">
                <li><a href="{% url 'dashboard' %}">📊 Dashboard</a></li>
                <li><a href="{% url 'admin_products' %}">📦 All Products</a></li>
                <li><a href="{% url 'admin_orders' %}">🛒 Orders</a></li>
                <li><a href="{% url 'admin_reservations' %}">📅 Reservations</a></li>
                <li><a href="{% url 'admin_users' %}" class="active">👥 Manage Users</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="{% url 'home' %}" class="sidebar-link" target="_blank">🌐 View Website</a>
                <a href="{% url 'logout' %}" class="logout-btn" style="text-decoration:none;display:block;text-align:center;margin-top:12px;">🚪 Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div>
                    <h1>Edit User: {{ edit_user.username }}</h1>
                    <p style="color:#64748b;margin-top:4px;">Update account details and role.</p>
                </div>
                <a href="{% url 'admin_users' %}" class="action-btn admin-only" style="text-decoration:none;">← Back to Users</a>
            </div>

            <div class="checkout-form-section" style="max-width:700px;">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" value="{{ edit_user.username }}" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" value="{{ edit_user.email }}" class="form-input">
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" value="{{ edit_user.first_name }}" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" value="{{ edit_user.last_name }}" class="form-input">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select name="group" class="form-input">
                            <option value="">No Role</option>
                            {% for g in groups %}
                            <option value="{{ g.name }}" {% if edit_user.groups.all.0.name == g.name %}selected{% endif %}>{{ g.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" style="display:flex;align-items:center;gap:12px;">
                        <input type="checkbox" name="is_superuser" id="is_superuser" {% if edit_user.is_superuser %}checked{% endif %} style="width:18px;height:18px;">
                        <label for="is_superuser" style="margin:0;">Superuser (Full Admin Access)</label>
                    </div>
                    <div style="display:flex;gap:12px;margin-top:24px;">
                        <button type="submit" class="action-btn bakery" style="border:none;cursor:pointer;font-size:0.95rem;">Save Changes</button>
                        <a href="{% url 'admin_users' %}" class="action-btn admin-only" style="text-decoration:none;">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
